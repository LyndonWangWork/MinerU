name: Build MinerU Executable

on:
  push:
    branches:
      - master      # Trigger on push to master branch
      - main        # Trigger on push to main branch (if using main)
      - build
    tags:
      - 'v*'        # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version tag for the build'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build matrix for macOS support only
        # All platforms use mineru-minimal.spec with the same configuration
        include:
          - os: macos-13  # Intel x64 architecture
            python-version: '3.11'
            artifact-name: mineru-macos-x64
            output-path: dist/mineru-build
            executable: mineru
          - os: macos-14  # Apple Silicon ARM64 (M1/M2/M3)
            python-version: '3.11'
            artifact-name: mineru-macos-arm64
            output-path: dist/mineru-build
            executable: mineru

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (macOS)
        run: |
          brew install upx

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller

      - name: Install MinerU dependencies
        run: |
          pip install -r requirements-minimal.txt
          pip install -e .

      - name: Verify installation
        run: |
          python -c "from mineru.version import __version__; print(f'MinerU version: {__version__}')"
          mineru --version

      - name: Build executable with PyInstaller
        run: |
          pyinstaller mineru-minimal.spec --clean --noconfirm

      - name: Verify build output
        shell: bash
        run: |
          if [ -d "${{ matrix.output-path }}" ]; then
            echo "Build successful!"
            ls -lh ${{ matrix.output-path }}/
          else
            echo "Build failed - output directory not found"
            exit 1
          fi

      - name: Test executable (basic)
        shell: bash
        run: |
          ${{ matrix.output-path }}/${{ matrix.executable }} --version

      - name: Create archive
        run: |
          cd dist
          tar -czf ../${{ matrix.artifact-name }}.tar.gz mineru-build/
          cd ..

      - name: Calculate checksums
        run: |
          shasum -a 256 ${{ matrix.artifact-name }}.tar.gz > ${{ matrix.artifact-name }}.tar.gz.sha256
          cat ${{ matrix.artifact-name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-name }}.*
          retention-days: 30

      - name: Get version tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.artifact-name }}.*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-build verification job
  verify:
    name: Verify builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -R

      - name: Verify checksums exist
        run: |
          echo "Verifying build artifacts..."
          test -f mineru-macos-x64/mineru-macos-x64.tar.gz.sha256 && echo "[OK] macOS x64 (Intel) checksum found"
          test -f mineru-macos-arm64/mineru-macos-arm64.tar.gz.sha256 && echo "[OK] macOS ARM64 (Apple Silicon) checksum found"
          echo "All checksums verified!"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- macOS x64 (Intel): \`mineru-macos-x64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ARM64 (Apple Silicon): \`mineru-macos-arm64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File Sizes:" >> $GITHUB_STEP_SUMMARY
          du -h mineru-macos-x64/* mineru-macos-arm64/* | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
